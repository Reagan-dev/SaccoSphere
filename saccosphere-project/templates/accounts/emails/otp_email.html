<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaccoSphere Verification Code</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f5;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f5f5f5;">
        <tr>
            <td style="padding: 40px 20px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
                    <tr>
                        <td style="padding: 30px 40px; border-bottom: 1px solid #e5e5e5;">
                            <h1 style="margin: 0; font-size: 24px; color: #333333;">SaccoSphere</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px;">
                            <p style="margin: 0 0 20px 0; font-size: 16px; color: #555555; line-height: 1.5;">
                                Your verification code is:
                            </p>
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: 20px 0;">
                                <tr>
                                    <td style="background-color: #f0f0f0; padding: 20px; text-align: center; border-radius: 6px;">
                                        <span style="font-size: 32px; font-weight: bold; color: #333333; letter-spacing: 4px;">{{ otp_code }}</span>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin: 20px 0 10px 0; font-size: 14px; color: #777777; line-height: 1.5;">
                                This code will expire in {{ expiry_minutes }} minutes.
                            </p>
                            <p style="margin: 10px 0 0 0; font-size: 14px; color: #777777; line-height: 1.5;">
                                If you did not request this code, please ignore this email.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 20px 40px; border-top: 1px solid #e5e5e5;">
                            <p style="margin: 0; font-size: 12px; color: #999999;">
                                This is an automated message from SaccoSphere. Please do not reply to this email.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
